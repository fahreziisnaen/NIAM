version: "3.9"

services:
  # 1. Enterprise PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: phillip_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PhillipPostgres2026!}
      POSTGRES_DB: ${POSTGRES_DB:-phillip_assets}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phillip_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-PhillipPostgres2026!}@db:5432/${POSTGRES_DB:-phillip_assets}
      SECRET_KEY: ${SECRET_KEY:-phillip-securities-hk-super-secret-key-2026-production}
      API_V1_STR: /api/v1
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  # 3. Next.js 14 Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phillip_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:

